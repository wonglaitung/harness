[project]
name = "harness-monorepo"
version = "0.1.0"
description = "Harness AI Agent SDK and Windows Desktop Client"
requires-python = ">=3.10"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
harness-sdk = { workspace = true }
harness-client = { workspace = true }

[tool.uv.workspace]
members = ["packages/sdk", "packages/client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
