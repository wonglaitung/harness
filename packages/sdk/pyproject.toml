[project]
name = "harness-sdk"
version = "0.1.0"
description = "Embeddable AI Agent SDK for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Harness Team"}
]
keywords = ["ai", "agent", "llm", "sdk", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "tiktoken>=0.5.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
vector = [
    "tiktoken>=0.5.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
sqlite = [
    "aiosqlite>=0.19.0",
]
web = [
    "beautifulsoup4>=4.12.0",
]
stuck = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
guardrails = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "httpx>=0.24.0",
    "cachetools>=5.3.0",
]
# Spring Cloud / Service integration
service = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
prometheus = [
    "prometheus-client>=0.17.0",
]
redis = [
    "redis>=4.5.0",
]
nacos = [
    "nacos-sdk-python>=0.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "redis: Tests requiring Redis server (deselect with '-m \"not redis\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/wonglaitung/harness"
Documentation = "https://github.com/wonglaitung/harness#readme"
Repository = "https://github.com/wonglaitung/harness"
