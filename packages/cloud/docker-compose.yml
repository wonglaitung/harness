# Docker Compose for Harness Cloud
#
# Services:
# - gateway: Main entry point (FastAPI + Docker manager)
# - redis: Rate limiter backend
#
# Security notes:
# - docker.sock is mounted read-only (ADR-007)
# - gateway and agent containers run as non-root user
# - Internal network for agent containers
#
# Reference: packages/cloud/docs/06-deployment.md

services:
  gateway:
    image: harness-gateway:latest
    build:
      context: ../..
      dockerfile: packages/cloud/docker/gateway.Dockerfile
      args:
        DOCKER_USER: ${DOCKER_USER:-appuser}
        DOCKER_UID: ${DOCKER_UID:-1000}
    ports:
      - "8080:8080"
    environment:
      - HARNESS_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - HARNESS_REDIS_URL=redis://redis:6379
      - HARNESS_ENVIRONMENT=docker
    volumes:
      # docker.sock for container management (read-only for security)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Frontend static files (for serving web UI)
      - ./frontend/dist:/app/frontend/dist:ro
    # Add user to docker group at runtime (GID from host)
    group_add:
      - ${DOCKER_GID:-1001}
    depends_on:
      - redis
    networks:
      - cloud-net
      - agent-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cloud-net
    restart: unless-stopped
    # Persistence optional for rate limiting
    # volumes:
    #   - redis-data:/data

networks:
  # Network for gateway-redis communication
  cloud-net:
    driver: bridge

  # Network for gateway-agent communication
  # Created by DockerManager at runtime (not internal - allows LLM API access)
  agent-net:
    name: harness-net
    driver: bridge