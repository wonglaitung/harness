[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-cloud"
version = "0.1.0"
description = "Harness Cloud - Docker-based AI Agent sandbox platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Harness Team", email = "team@harness.dev" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "docker>=6.0",
    "redis>=4.5",
    "httpx>=0.25.0",
    # Local SDK dependency
    "harness-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_cloud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
