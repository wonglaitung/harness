name: SDK Tests

on:
  push:
    paths:
      - "packages/sdk/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    paths:
      - "packages/sdk/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install SDK + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install redis
      - name: Run unit tests
        run: python -m pytest tests/unit -q
