name: 每日情报推送

on:
  # 每天上午 6:00 香港时间
  # 6:00 HK = 22:00 UTC (前一天)
  schedule:
    - cron: '0 22 * * *'  # 上午 6:00 香港时间
  # 允许手动触发
  workflow_dispatch:
    inputs:
      send_email:
        description: '是否发送邮件'
        required: false
        default: 'true'
        type: boolean
      skill:
        description: '运行特定技能 (ai-intelligence 或 hk-stocks-alpha)'
        required: false
        default: 'all'
      max_iterations:
        description: '最大迭代次数'
        required: false
        default: '25'
        type: string

permissions:
  contents: write

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
    - name: Checkout harness
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --all-packages

    - name: Set environment variables
      run: |
        # Email configuration
        echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}" >> $GITHUB_ENV
        echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> $GITHUB_ENV
        echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> $GITHUB_ENV
        echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> $GITHUB_ENV
        # LLM configuration (HARNESS_LLM_* for scraper)
        echo "HARNESS_LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> $GITHUB_ENV
        echo "HARNESS_LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}" >> $GITHUB_ENV
        echo "HARNESS_LLM_MODEL=${{ secrets.LLM_MODEL }}" >> $GITHUB_ENV

    - name: Run AI intelligence scraper (Goal-Driven)
      if: ${{ github.event.inputs.skill == 'all' || github.event.inputs.skill == 'ai-intelligence' || github.event.inputs.skill == '' }}
      run: |
        echo "=== Running AI Intelligence (Goal-Driven) ==="
        uv run python packages/scraper/scripts/run_goal.py --skill ai-intelligence --max-iterations ${{ github.event.inputs.max_iterations || '25' }} --timeout 1800
      continue-on-error: true

    - name: Run HK stocks scraper (Goal-Driven)
      if: ${{ github.event.inputs.skill == 'all' || github.event.inputs.skill == 'hk-stocks-alpha' || github.event.inputs.skill == '' }}
      run: |
        echo "=== Running HK Stocks Alpha (Goal-Driven) ==="
        uv run python packages/scraper/scripts/run_goal.py --skill hk-stocks-alpha --max-iterations ${{ github.event.inputs.max_iterations || '25' }} --timeout 1800
      continue-on-error: true

    - name: Send intelligence emails
      if: ${{ github.event.inputs.send_email == 'true' || github.event.inputs.send_email == '' }}
      run: |
        echo "=== Sending Intelligence Emails ==="
        uv run python packages/scraper/scripts/send_intelligence_email.py

    - name: Show generated files
      run: |
        echo "=== Generated Files ==="
        date_str=$(date +%Y-%m-%d)
        ls -la packages/scraper/output/$date_str/ai/ 2>/dev/null || echo "No AI files"
        ls -la packages/scraper/output/$date_str/stocks/ 2>/dev/null || echo "No stocks files"

    - name: Commit generated files and memory
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Add output directory (One-Pagers and MEMORY.md)
        git add packages/scraper/output/

        # Check if there are changes to commit
        if ! git diff --staged --quiet; then
          git commit -m "docs(scraper): Update daily intelligence reports (Goal-Driven) [skip ci]"
          git push || echo "No changes to push"
        else
          echo "No new files to commit"
        fi