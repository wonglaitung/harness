name: 每日情报推送

on:
  # 每天上午 6:00 香港时间
  # 6:00 HK = 22:00 UTC (前一天)
  schedule:
    - cron: '0 22 * * *'  # 上午 6:00 香港时间
  # 允许手动触发
  workflow_dispatch:
    inputs:
      send_email:
        description: '是否发送邮件'
        required: false
        default: 'true'
        type: boolean
      skill:
        description: '运行特定技能 (ai-intelligence 或 hk-stocks-alpha)'
        required: false
        default: 'all'
      max_iterations:
        description: '最大迭代次数'
        required: false
        default: '25'
        type: string

permissions:
  contents: write

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
    - name: Checkout harness
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --all-packages

    - name: Set environment variables
      run: |
        # Email configuration
        echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}" >> $GITHUB_ENV
        echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> $GITHUB_ENV
        echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> $GITHUB_ENV
        echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> $GITHUB_ENV
        # LLM configuration (HARNESS_LLM_* for scraper)
        echo "HARNESS_LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> $GITHUB_ENV
        # 未配置 secret 时回退到 OpenCode Zen（OpenAI 兼容端点）
        echo "HARNESS_LLM_BASE_URL=${{ secrets.LLM_BASE_URL || 'https://opencode.ai/zen/v1' }}" >> $GITHUB_ENV
        echo "HARNESS_LLM_MODEL=${{ secrets.LLM_MODEL }}" >> $GITHUB_ENV
        # opencode zen/go 端点要求会话标识头（缺失返回 400 MissingSessionID）：
        # 优先用仓库 secret，缺省用本次 run id 派生一个稳定值。
        echo "HARNESS_LLM_SESSION_ID=${{ secrets.OPENCODE_SESSION_ID || format('harness-scraper-{0}', github.run_id) }}" >> $GITHUB_ENV
        # 其他网关自定义头（JSON 对象，可选）
        echo "HARNESS_LLM_EXTRA_HEADERS=${{ secrets.LLM_EXTRA_HEADERS }}" >> $GITHUB_ENV

    - name: Preflight LLM connectivity
      run: |
        echo "=== LLM 连通性预检 ==="
        echo "Base URL: $HARNESS_LLM_BASE_URL"
        echo "Model: $HARNESS_LLM_MODEL"
        endpoint="${HARNESS_LLM_BASE_URL%/}"
        case "$endpoint" in
          */chat/completions) url="$endpoint" ;;
          *) url="$endpoint/chat/completions" ;;
        esac
        echo "Probe URL: $url"
        rm -f /tmp/llm_probe.json  # 避免 curl 失败时把上一次的返回体当成本次结果
        status=$(curl -sS -o /tmp/llm_probe.json -w "%{http_code}" --max-time 30 \
          -H "Authorization: Bearer $HARNESS_LLM_API_KEY" \
          -H "Content-Type: application/json" \
          -H "x-opencode-session: ${HARNESS_LLM_SESSION_ID:-preflight}" \
          "$url" \
          -d "{\"model\":\"$HARNESS_LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":16}")
        echo "HTTP $status"
        head -c 500 /tmp/llm_probe.json || true
        echo
        # 诊断只在失败时落盘，避免每次运行都把日志提交进仓库；
        # 成功时清掉上一次失败留下的诊断文件。
        if [ "$status" = "200" ]; then
          rm -f packages/scraper/output/diagnostics/llm_probe.txt \
                packages/scraper/output/diagnostics/llm_probe.json
          echo "OK: LLM 端点可用"
        else
          mkdir -p packages/scraper/output/diagnostics
          {
            echo "time_utc: $(date -u +%FT%TZ)"
            echo "base_url: $HARNESS_LLM_BASE_URL"
            echo "model: $HARNESS_LLM_MODEL"
            echo "session_header_set: $([ -n "$HARNESS_LLM_SESSION_ID" ] && echo yes || echo no)"
            echo "http_status: $status"
            echo "body: $(head -c 800 /tmp/llm_probe.json)"
          } > packages/scraper/output/diagnostics/llm_probe.txt
          cp /tmp/llm_probe.json packages/scraper/output/diagnostics/llm_probe.json || true
          cat packages/scraper/output/diagnostics/llm_probe.txt
          case "$status" in
            401|403) echo "FAIL: 鉴权失败——检查 LLM_API_KEY 是否过期或与端点不匹配" ;;
            400) echo "FAIL: 请求被拒——若返回 MissingSessionID 说明会话头未生效" ;;
            404) echo "FAIL: 端点或模型不存在——检查 BASE_URL / MODEL" ;;
            429) echo "FAIL: 限流或额度用尽" ;;
            *) echo "FAIL: 其它错误，见上方返回体" ;;
          esac
        fi

    - name: Run AI intelligence scraper (Goal-Driven)
      if: ${{ github.event.inputs.skill == 'all' || github.event.inputs.skill == 'ai-intelligence' || github.event.inputs.skill == '' }}
      run: |
        echo "=== Running AI Intelligence (Goal-Driven) ==="
        # GitHub 默认用 `bash -e`，失败会直接退出——先关掉 errexit，
        # 保证失败时也能把日志落盘（否则诊断文件永远写不出来）。
        set +e
        uv run python packages/scraper/scripts/run_goal.py --skill ai-intelligence --max-iterations ${{ github.event.inputs.max_iterations || '25' }} --timeout 1800 > /tmp/ai_intelligence.log 2>&1
        rc=$?
        if [ "$rc" -ne 0 ]; then
          mkdir -p packages/scraper/output/diagnostics
          { echo "skill: ai-intelligence"; echo "exit_code: $rc"; echo "--- log (tail 400) ---"; tail -n 400 /tmp/ai_intelligence.log; } > packages/scraper/output/diagnostics/ai_intelligence.log.txt
          tail -n 80 /tmp/ai_intelligence.log
        else
          rm -f packages/scraper/output/diagnostics/ai_intelligence.log.txt
          echo "OK: ai-intelligence 完成（不写诊断日志）"
        fi
        exit $rc
      continue-on-error: true

    - name: Run HK stocks scraper (Goal-Driven)
      if: ${{ github.event.inputs.skill == 'all' || github.event.inputs.skill == 'hk-stocks-alpha' || github.event.inputs.skill == '' }}
      run: |
        echo "=== Running HK Stocks Alpha (Goal-Driven) ==="
        set +e
        uv run python packages/scraper/scripts/run_goal.py --skill hk-stocks-alpha --max-iterations ${{ github.event.inputs.max_iterations || '25' }} --timeout 1800 > /tmp/hk_stocks.log 2>&1
        rc=$?
        if [ "$rc" -ne 0 ]; then
          mkdir -p packages/scraper/output/diagnostics
          { echo "skill: hk-stocks-alpha"; echo "exit_code: $rc"; echo "--- log (tail 400) ---"; tail -n 400 /tmp/hk_stocks.log; } > packages/scraper/output/diagnostics/hk_stocks.log.txt
          tail -n 80 /tmp/hk_stocks.log
        else
          rm -f packages/scraper/output/diagnostics/hk_stocks.log.txt
          echo "OK: hk-stocks-alpha 完成（不写诊断日志）"
        fi
        exit $rc
      continue-on-error: true

    - name: Verify generated output
      run: |
        date_str=$(date +%Y-%m-%d)
        if [ -d "packages/scraper/output/$date_str" ] && [ -n "$(ls -A "packages/scraper/output/$date_str" 2>/dev/null)" ]; then
          echo "OK: 已生成 $date_str 的产出"
        else
          echo "FAIL: $date_str 没有产出——抓取步骤失败，请看上方 LLM 预检与抓取日志"
          exit 1
        fi

    - name: Send intelligence emails
      if: ${{ github.event.inputs.send_email == 'true' || github.event.inputs.send_email == '' }}
      run: |
        echo "=== Sending Intelligence Emails ==="
        uv run python packages/scraper/scripts/send_intelligence_email.py

    - name: Show generated files
      run: |
        echo "=== Generated Files ==="
        date_str=$(date +%Y-%m-%d)
        ls -la packages/scraper/output/$date_str/ai/ 2>/dev/null || echo "No AI files"
        ls -la packages/scraper/output/$date_str/stocks/ 2>/dev/null || echo "No stocks files"

    - name: Commit generated files and memory
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Add output directory (One-Pagers and MEMORY.md)
        git add packages/scraper/output/

        # Check if there are changes to commit
        if ! git diff --staged --quiet; then
          git commit -m "docs(scraper): Update daily intelligence reports (Goal-Driven) [skip ci]"
          git push || echo "No changes to push"
        else
          echo "No new files to commit"
        fi