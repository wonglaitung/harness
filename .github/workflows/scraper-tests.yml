name: Scraper Tests

on:
  push:
    paths:
      - "packages/scraper/**"
      - "packages/sdk/**"
      - ".github/workflows/scraper-tests.yml"
  pull_request:
    paths:
      - "packages/scraper/**"
      - "packages/sdk/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install SDK + scraper
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[dev]"
      - name: Run scraper tests
        run: python -m pytest tests -q
