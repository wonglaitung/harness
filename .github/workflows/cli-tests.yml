name: CLI Tests

on:
  push:
    paths:
      - "packages/cli/**"
      - "packages/sdk/**"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/sdk/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install SDK + CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[test]"
      - name: Guard dependency direction
        run: |
          if grep -r "harness_cli" ../sdk/src; then
            echo "SDK must not depend on harness_cli"
            exit 1
          fi
      - name: Run CLI tests
        run: python -m pytest tests -q
